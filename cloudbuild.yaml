# Google Cloud Build Pipeline for MÂY Image Studio
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/may-image-studio:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/may-image-studio:latest', '.']

  # 2. Push container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/may-image-studio:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/may-image-studio:latest']

  # 3. Deploy to Google Cloud Run (Serverless)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'may-image-studio'
      - '--image'
      - 'gcr.io/$PROJECT_ID/may-image-studio:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'

images:
  - 'gcr.io/$PROJECT_ID/may-image-studio:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/may-image-studio:latest'
