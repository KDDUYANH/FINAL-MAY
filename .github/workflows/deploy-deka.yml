name: Deploy to DEKA Server (Compute Engine)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/**'
      - 'docker/deka-server/**'
      - '.github/workflows/deploy-deka.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast1
  ZONE: asia-southeast1-b
  REGISTRY: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/deka

jobs:
  deploy-deka:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build & Push Workers
        run: |
          docker build -t $REGISTRY/media-worker:${{ github.sha }} -t $REGISTRY/media-worker:latest -f services/media-worker/Dockerfile services/media-worker
          docker push $REGISTRY/media-worker:latest

          docker build -t $REGISTRY/ai-worker:${{ github.sha }} -t $REGISTRY/ai-worker:latest -f services/ai-worker/Dockerfile services/ai-worker
          docker push $REGISTRY/ai-worker:latest

          docker build -t $REGISTRY/api-service:${{ github.sha }} -t $REGISTRY/api-service:latest -f services/api-service/Dockerfile services/api-service
          docker push $REGISTRY/api-service:latest

      - name: Deploy to DEKA Server VM via SSH
        run: |
          gcloud compute scp --zone=$ZONE --recurse \
            docker/deka-server/docker-compose.yml \
            docker/deka-server/Caddyfile \
            deka-server:/opt/deka/

          gcloud compute ssh deka-server --zone=$ZONE --command="
            export REGISTRY_HOST=$REGISTRY
            export TAG=latest
            cd /opt/deka
            docker compose pull
            docker compose up -d --remove-orphans
          "
